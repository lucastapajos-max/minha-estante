<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e0a458">
  <title>Estante</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Splash inicial -->
  <div id="splash"><div class="splash-logo">📚</div></div>

  <!-- ===== Tela de login (só no modo nuvem) ===== -->
  <section id="tela-login" class="login-tela" hidden>
    <div class="login-card">
      <div class="login-logo">📚</div>
      <div class="login-titulo">Estante</div>
      <div class="login-sub">Entre para acessar sua biblioteca</div>
      <input id="login-email" class="input" type="email" inputmode="email" placeholder="E-mail" autocomplete="username">
      <input id="login-senha" class="input" type="password" placeholder="Senha" autocomplete="current-password">
      <div class="login-erro" id="login-erro"></div>
      <button class="btn-primary login-btn" id="btn-login">Entrar</button>
    </div>
  </section>

  <main id="app" hidden>
    <!-- ===== Cabeçalho ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">📚</span>
        <span class="brand-name">Estante</span>
      </div>
      <div class="topbar-actions">
        <button class="btn-primary" id="btn-adicionar">+ Adicionar</button>
        <button class="icon-btn" id="btn-sair" aria-label="Sair" hidden>⎋</button>
      </div>
    </header>

    <!-- ===== Abas por categoria ===== -->
    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-kind="livro">Livros</button>
      <button class="tab" data-kind="quadrinho">Quadrinhos</button>
      <button class="tab" data-kind="manga">Mangás</button>
    </nav>

    <!-- ===== Barra de filtros ===== -->
    <div class="toolbar">
      <div class="chips" id="filtros-status">
        <button class="chip is-active" data-status="todos">Todos</button>
        <button class="chip" data-status="lendo">Lendo</button>
        <button class="chip" data-status="quero_ler">Quero ler</button>
        <button class="chip" data-status="lido">Lido</button>
        <button class="chip" data-status="pausado">Pausado</button>
        <button class="chip" data-status="abandonado">Abandonado</button>
      </div>
      <div class="toolbar-right">
        <input type="search" id="busca-local" class="input-busca" placeholder="Filtrar na estante…" autocomplete="off">
        <div class="view-toggle" id="view-toggle">
          <button class="vt is-active" data-view="grid" aria-label="Grade">▦</button>
          <button class="vt" data-view="list" aria-label="Lista">≣</button>
        </div>
      </div>
    </div>

    <!-- ===== Biblioteca ===== -->
    <section class="biblioteca" id="biblioteca"></section>

    <!-- Estado vazio -->
    <div class="vazio" id="vazio" hidden>
      <div class="vazio-emoji">🔖</div>
      <div class="vazio-titulo">Sua estante está vazia por aqui</div>
      <div class="vazio-sub">Toque em <b>+ Adicionar</b> para buscar e cadastrar seu primeiro título.</div>
    </div>
  </main>

  <!-- ================= Modal: Adicionar / Buscar ================= -->
  <div class="modal-bg" id="modal-add" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-titulo" id="add-titulo">Adicionar título</div>
        <button class="icon-btn" id="add-fechar" aria-label="Fechar">✕</button>
      </div>

      <div class="add-search-row">
        <input type="search" id="add-input" class="input" placeholder="Buscar por título, autor…" autocomplete="off">
        <button class="btn-primary" id="add-buscar">Buscar</button>
      </div>
      <div class="add-hint" id="add-hint"></div>

      <div class="add-resultados" id="add-resultados"></div>

      <div class="add-manual-linha">
        <button class="link-btn" id="btn-manual">ou cadastrar manualmente</button>
      </div>
    </div>
  </div>

  <!-- ================= Modal: Ficha do item ================= -->
  <div class="modal-bg" id="modal-ficha" hidden>
    <div class="modal modal-ficha">
      <div class="modal-head">
        <div class="modal-titulo">Ficha</div>
        <button class="icon-btn" id="ficha-fechar" aria-label="Fechar">✕</button>
      </div>
      <div id="ficha-corpo"><!-- montado via JS --></div>
    </div>
  </div>

  <!-- ================= Modal: Cadastro manual ================= -->
  <div class="modal-bg" id="modal-manual" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-titulo">Cadastro manual</div>
        <button class="icon-btn" id="manual-fechar" aria-label="Fechar">✕</button>
      </div>
      <div id="manual-corpo"><!-- montado via JS --></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Config (chaves do Supabase) + cliente Supabase -->
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <!-- Camada de dados isolada (escolhe local <-> supabase) -->
  <script src="store.js"></script>
  <!-- APIs externas (Google Books / Jikan / MangaDex) -->
  <script src="apis.js"></script>
  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
